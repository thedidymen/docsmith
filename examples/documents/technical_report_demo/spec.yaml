project:
  slug: technical-report-demo
  template: ../../templates/technical_report

metadata:
  title: Docsmith Technical Report Demo
  subtitle: A compact shared-template showcase
  author: Docsmith Contributors
  date: "2026-03-16"

document:
  input_root: sections
